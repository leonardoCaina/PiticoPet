<!DOCTYPE html>
<html lang="en">
<head>
    
   
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">


</head>
<body>

<div class="signup-container">
        <form id="signupForm">
            <h2>Cadastro</h2>
            <div class="input-group">
          
<label for="name">Nome:</label>
                
    

 
<input type="text" id="name" name="name" placeholder="Digite seu nome completo" required>
     
</div>
            
    

 
<div class="input-group">
                
   
<label for="email">Email:</label>
                
           

        

     

  
<input type="email" id="email" name="email" placeholder="Digite seu email" required>
            
        
</div>
            <div class="input-group">
                
               
<label for="password">Senha:</label>
                
    

 
<input type="password" id="password" name="password" placeholder="Digite uma senha" required>
            
          
</div>
            <div class="input-group">
                
        

      

   
<label for="confirm-password">Confirme a Senha:</label>
                
    

  
<input type="password" id="confirm-password" name="confirm-password" placeholder="Confirme sua senha" required>
            
 
</div>
            
            

          

       

    
<button type="submit">Cadastrar</button>
            
            
<p id="error-message"></p>
            
        

          

       

    
<p class="login-link">
                Já possui conta? 
<a href="login.html">Faça login!</a>
            
           
</p>
        
       
</form>
    
   
</div>
    
   
<script src="cadastro.js"></script>


</body>
</html>
