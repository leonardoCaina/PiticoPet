<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="./css/login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <form id="loginForm">
        
            
<h2>Login</h2>
            
            
<div class="input-group">
                
    

 
<label for="email">E-mail:</label>
                
           

        

     

  
<input type="email" id="email" name="email" placeholder="Entre com seu E-mail" required>
            
           

        

     

  
</div>
            
           
<div class="input-group">
                
          

       

    

 
<label for="password">Senha:</label>
                
    

 
<input type="password" id="password" name="password" placeholder="Entre com sua senha" required>
            
          
</div>
            
            
<button type="submit">Login</button>
            <p id="error-message"></p>

            <p class="cadastro-link">
                Não possuí conta? 
        <a href="cadastro.html">Faça o cadastro!!</a>
        <br>
        ou
        <br>
        Deseja voltar ao ínicio da página?
        <a href="sobre.html">Clique aqui!</a>
           
        </p>
        </form>
    </div>


    <script src="js/login.js"></script>


</body>

</html>
